version: 2

# One pull request per ecosystem, not one per package.
#
# The first run opened six: the npm packages were grouped, the Actions were not,
# so every action arrived on its own branch. Six branches on a repository with
# one real branch is noise, and noise is how a genuine security update gets
# skimmed past. Everything is grouped now.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # The dependency set is three packages by design and each one is
      # load-bearing, so review them together rather than separately.
      runtime:
        patterns: ['three', '@types/three', 'lenis', 'gsap']
      build:
        patterns: ['vite', 'typescript']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
